for(let n=0;n<5;n++){
 const src=images[n],sc=C(src.width,src.height),sg=sc.getContext('2d',{willReadFrequently:true});sg.drawImage(src,0,0);const b=bbox(sg.getImageData(0,0,sc.width,sc.height).data,sc.width,sc.height);const w=n===0?512:128,h=(n===1||n===2)?96:64,c=C(w,h),g=c.getContext('2d',{willReadFrequently:true});g.imageSmoothingQuality='high';
 let dw,dh;if(n===0){dw=512;dh=48}else{const f=Math.min(112/b[2],(h-16)/b[3]);dw=Math.floor(b[2]*f);dh=Math.floor(b[3]*f)}
 g.drawImage(src,...b,Math.floor((w-dw)/2),h-8-dh,dw,dh);
 const im=g.getImageData(0,0,w,h),d=im.data;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){let i=(y*w+x)*4;if(y<8||y>=h-8||(n!==0&&(x<8||x>=w-8))){d.fill(0,i,i+4);}else{let f=1;if(n===0)f=Math.min(1,(y-7)/8,(h-8-y)/8);else f=Math.min(1,(x-7)/8,(w-8-x)/8);d[i+3]=Math.round(d[i+3]*f);if(d[i+3]<2)d.fill(0,i,i+4);}}
 let seamBefore=null;
 if(n===0){
   let diff=0;for(let y=0;y<h;y++)for(let k=0;k<4;k++)diff+=Math.abs(d[(y*w)*4+k]-d[(y*w+w-1)*4+k]);seamBefore=diff/(h*4);
   const original=new Uint8ClampedArray(d);
   for(let y=8;y<h-8;y++){

     for(let k=0;k<3;k++)profile[k]=weight?Math.round(profile[k]/weight):0;profile[3]=Math.round(profile[3]/32);
     for(let x=0;x<w;x++){const dist=Math.min(x,w-1-x);if(dist>=40)continue;const t=dist<16?1:1-(dist-16)/24;const i=(y*w+x)*4;for(let k=0;k<4;k++)d[i+k]=Math.round(original[i+k]*(1-t)+profile[k]*t);}
   }
 }
 g.putImageData(im,0,0);await save(c,ids[n]+'.png');assets.push(c);
 let padViolations=0;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if((y<8||y>=h-8||(n!==0&&(x<8||x>=w-8)))&&d[(y*w+x)*4+3])padViolations++;

 metrics.push({assetId:ids[n],sourceSize:[src.width,src.height],sourceAlphaBounds:b,size:[w,h],alphaBounds:bbox(d,w,h),pivot:[w/2,h-8],padViolations,seamBeforeMeanRGBA:seamBefore,seamMaxRGBA:n===0?seamMax:null,end16BandMaxRGBA:n===0?bandMax:null,manualEdits:'crop alpha bounds >2; fit target interior; browser high-quality resampling; explicit 8px alpha gutter; non-blur coverage taper'+(n===0?'; periodic 16px edge profile matched, 24px linear transition into source on each side':''),nativeRequestedSizeHonored:src.width===w&&src.height===h});
}

checker(g,32,116,1536,64);for(let i=0;i<3;i++)g.drawImage(assets[0],32+i*512,116);
for(let x of [544,1056]){g.strokeStyle='#efd08c';g.lineWidth=1;g.beginPath();g.moveTo(x,96);g.lineTo(x,114);g.moveTo(x,182);g.lineTo(x,200);g.stroke();text(g,'이음',x-17,218,15,'#efd08c');}
text(g,'줌 1.0 · 256×32px씩 (64×32px / 타일)',32,272,18);for(let i=0;i<3;i++)g.drawImage(assets[0],32+i*256,288,256,32);
text(g,'줌 0.6 · 153.6×19.2px씩',32,368,18);for(let i=0;i<3;i++)g.drawImage(assets[0],32+i*153.6,387,153.6,19.2);
text(g,'끝 16px RGBA 일치 / 최외곽 열 차이 0 · 픽셀 값 일치는 기술 검사이며, 시각적 반복감 검수는 별도',32,477,17);
await save(check,'checks/01-strip-repeat.png');
// Scene drawn at actual zoom1 CSS pixel scale, subsequently reduced uniformly to 0.6.
const scene=C(720,530),s=scene.getContext('2d');s.fillStyle=s.createPattern(refs[0],'repeat');s.fillRect(0,0,720,530);
const point=t=>({x:45+625*t,y:132+52*Math.sin(2*Math.PI*t)});
let last=point(0),arc=0;for(let i=1;i<=850;i++){const p=point(i/850),dx=p.x-last.x,dy=p.y-last.y,len=Math.hypot(dx,dy),a=Math.atan2(dy,dx);s.save();s.translate(last.x,last.y);s.rotate(a);s.drawImage(assets[0],(arc*2)%510,0,2,64,-.3,-16,len+.65,32);s.restore();arc+=len;last=p;}
// Grass edge follows the upper side of a few road sections at native half scale.
for(const t of [.25,.33,.42,.65,.73]){const p=point(t),a=Math.atan2(104*Math.PI*Math.cos(2*Math.PI*t),625);s.save();s.translate(p.x+Math.sin(a)*13,p.y-Math.cos(a)*13);s.rotate(a+Math.atan(.5));s.drawImage(assets[4],-32,-16,64,32);s.restore();}
// Forest boundary: the same A/B assets, not regenerated, six placements with small deterministic offsets.
s.fillStyle=s.createPattern(refs[1],'repeat');s.fillRect(30,250,358,63);
for(let i=0;i<6;i++){const y=315+[0,2,-1,1,-2,0][i];s.drawImage(assets[1+i%2],31+i*53,y-44,64,48);}
// Two adjacent 2x2-cell fields: each existing farm picture covers 128x64px here.
s.drawImage(refs[3],430,330,128,64);s.drawImage(refs[3],494,362,128,64);s.drawImage(assets[3],494,362,64,32);
// Native-size isolated samples share the same grass, for honest low-zoom readability.
s.drawImage(assets[1],50,420,64,48);s.drawImage(assets[2],128,420,64,48);s.drawImage(assets[3],230,430,64,32);s.drawImage(assets[4],335,430,64,32);
text(s,'S 흙길 + 잔디 경계',28,33,16,'#233421');text(s,'A / B × 3 · 6개',30,238,16,'#233421');text(s,'기존 밀밭 2장 + 고랑',437,313,16,'#233421');text(s,'개별 형태 비교',30,411,16,'#233421');
