<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="640" fill="#fbf8f0"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#555"/></marker>
  </defs>
  <!-- lane headers -->
  <text x="40" y="40" font-size="18" font-weight="bold" fill="#1d3f6e">① 입력 의도 (저장 안 함)</text>
  <text x="330" y="40" font-size="18" font-weight="bold" fill="#6b3a12">② 원본 상태 = 판정 격자 (저장)</text>
  <text x="700" y="40" font-size="18" font-weight="bold" fill="#2e5e2e">③ 파생 표현 (저장 안 함, 캐시)</text>
  <rect x="20" y="55" width="280" height="560" rx="10" fill="#e8eef7" stroke="#9fb3cf"/>
  <rect x="315" y="55" width="360" height="560" rx="10" fill="#f5ebe0" stroke="#cfae8a"/>
  <rect x="690" y="55" width="490" height="560" rx="10" fill="#e7f0e3" stroke="#9fc09a"/>

  <!-- intents -->
  <g fill="#fff" stroke="#6d8bb5">
    <rect x="40" y="80" width="240" height="70" rx="6"/><rect x="40" y="200" width="240" height="70" rx="6"/>
    <rect x="40" y="330" width="240" height="70" rx="6"/><rect x="40" y="470" width="240" height="70" rx="6"/>
  </g>
  <text x="52" y="105">도로 긋기 stroke</text><text x="52" y="127" font-size="12" fill="#444">strokeBegin/Move/End → 스냅·곡률 한계</text><text x="52" y="143" font-size="12" fill="#444">→ 4-연결 셀 경로 (행동 = 셀 목록)</text>
  <text x="52" y="225">성벽 긋기 (현행 유지)</text><text x="52" y="247" font-size="12" fill="#444">격자 모서리 8방향 스냅</text><text x="52" y="263" font-size="12" fill="#444">snapPalisadeStroke</text>
  <text x="52" y="355">구역 그리기</text><text x="52" y="377" font-size="12" fill="#444">자유 다각형 → 1/8칸 정수 양자화</text><text x="52" y="393" font-size="12" fill="#444">paint_zone 행동</text>
  <text x="52" y="495">지형 (생성 시 1회)</text><text x="52" y="517" font-size="12" fill="#444">generateTerrainTile (seed)</text>

  <!-- state -->
  <g fill="#fff" stroke="#b98b5b">
    <rect x="335" y="80" width="320" height="100" rx="6"/><rect x="335" y="200" width="320" height="80" rx="6"/>
    <rect x="335" y="320" width="320" height="100" rx="6"/><rect x="335" y="450" width="320" height="100" rx="6"/>
  </g>
  <text x="347" y="105" font-weight="bold">tiles[].hasRoad (현행)</text><text x="347" y="127" font-size="12" fill="#444">4-이웃 도로 그래프 · BFS · pathCache</text><text x="347" y="145" font-size="12" fill="#444">새 저장 필드 없음 (1단계)</text><text x="347" y="163" font-size="12" fill="#444">roadRevision 증가 규칙 동일</text>
  <text x="347" y="225" font-weight="bold">palisade.polygon · segments (현행)</text><text x="347" y="247" font-size="12" fill="#444">격자 모서리 경로 = 통행 차단 원본</text><text x="347" y="265" font-size="12" fill="#444">canTraverseWallBoundary</text>
  <text x="347" y="345" font-weight="bold">zones[] (신규, 스키마 v2)</text><text x="347" y="367" font-size="12" fill="#444">id · kind(burgage|open_field) · geometry(정수 다각형)</text><text x="347" y="385" font-size="12" fill="#444">revision · createdTick</text><text x="347" y="403" font-size="12" fill="#444">tileMembership은 저장하지 않음 (결정론 파생)</text>
  <text x="347" y="475" font-weight="bold">tiles[].terrain (현행)</text><text x="347" y="497" font-size="12" fill="#444">grass · forest · water · rock</text><text x="347" y="515" font-size="12" fill="#444">해안·숲 경계는 여기서만 파생</text>

  <!-- derived -->
  <g fill="#fff" stroke="#7fa877">
    <rect x="710" y="80" width="450" height="100" rx="6"/><rect x="710" y="200" width="450" height="80" rx="6"/>
    <rect x="710" y="320" width="450" height="100" rx="6"/><rect x="710" y="450" width="450" height="100" rx="6"/>
  </g>
  <text x="722" y="105" font-weight="bold">도로 체인 → 매끈한 중심선 → 리본</text><text x="722" y="127" font-size="12" fill="#444">체인 추출(차수≠2 노드) · 평균5+Chaikin2 · 교차로/광장 윤곽</text><text x="722" y="145" font-size="12" fill="#444">허용: 리본은 도로 셀에서 ≤0.25칸, 모든 도로 셀을 가시적으로 덮음</text><text x="722" y="163" font-size="12" fill="#444">키: roadRevision + 벽 서명</text>
  <text x="722" y="225" font-weight="bold">성벽 구속 스무딩 곡선</text><text x="722" y="247" font-size="12" fill="#444">avg3+Chaikin3 · 차단 링크 집합 = 격자 경로와 동일(검증)</text><text x="722" y="265" font-size="12" fill="#444">키: 성벽 객체 참조 (WeakMap)</text>
  <text x="722" y="345" font-weight="bold">tileMembership · frontage 필지 · 지면 채움</text><text x="722" y="367" font-size="12" fill="#444">셀 중심 정수 포함판정 → 소속 셀 → 다중 라벨 윤곽</text><text x="722" y="385" font-size="12" fill="#444">필지: 도로 체인의 법선 방향 띠 (국소 재계산)</text><text x="722" y="403" font-size="12" fill="#444">키: zone.revision + roadRevision + tiles 참조</text>
  <text x="722" y="475" font-weight="bold">해안·숲 윤곽선 (marching squares + Chaikin)</text><text x="722" y="497" font-size="12" fill="#444">셀 경계 중점을 지남 → 셀 경계에서 ≤0.35칸</text><text x="722" y="515" font-size="12" fill="#444">지면 청크 캐시 (16×16칸, 오프스크린 캔버스)</text><text x="722" y="533" font-size="12" fill="#444">키: 청크 더티 비트 + 줌 버킷 + DPR</text>

  <g stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M280,115 L333,125"/><path d="M280,235 L333,240"/><path d="M280,365 L333,370"/><path d="M280,505 L333,500"/>
    <path d="M655,130 L708,130"/><path d="M655,240 L708,240"/><path d="M655,370 L708,370"/><path d="M655,500 L708,500"/>
    <path d="M655,160 C680,260 690,330 708,395"/>
  </g>
  <text x="330" y="600" font-size="13" fill="#6b3a12">시뮬레이션(통행·배치·서비스·운반·저장)은 ②만 읽는다</text>
  <text x="705" y="600" font-size="13" fill="#2e5e2e">화면과 클릭 보조는 ③을 읽는다 · ③은 언제든 ②에서 재생성 가능</text>
</svg>
